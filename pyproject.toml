[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplibs-object"
version = "0.1.0"
description = "A powerful meta-programming framework for building structured, validated, and composable parametric classes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "meta-programming",
    "data-modeling",
    "validation",
    "composition",
    "parametric-classes",
    "simplibs",
    "simple-object",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "simplibs-exception>=1.0.0",
    "simplibs-sentinels>=0.1.0",
    "simplibs-randomize>=0.1.0",
]

[[project.authors]]
name = "Dalibor Sova (Sudip2708)"
email = "daliborsova@seznam.cz"

[project.urls]
Homepage = "https://github.com/simplibs/simplibs-object"
Repository = "https://github.com/simplibs/simplibs-object"
Issues = "https://github.com/simplibs/simplibs-object/issues"
Changelog = "https://github.com/simplibs/simplibs-object/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["src"]